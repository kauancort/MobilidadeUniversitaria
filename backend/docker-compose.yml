services:
  postgres:
    image: postgres:15-alpine
    container_name: gocampus-db
    environment:
      POSTGRES_DB: gocampus
      POSTGRES_USER: gocampus
      POSTGRES_PASSWORD: gocampus123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gocampus -d gocampus"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./mobilidadeUniversitaria
      dockerfile: Dockerfile
    container_name: gocampus-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gocampus
      SPRING_DATASOURCE_USERNAME: gocampus
      SPRING_DATASOURCE_PASSWORD: gocampus123
      APP_JWT_SECRET: mobilidade-universitaria-jwt-secret-prod-2026
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:4200,http://localhost:8081
      APP_UPLOAD_DIR: /app/uploads
    ports:
      - "8082:8081"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
