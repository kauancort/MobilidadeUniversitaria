spring.application.name=mobilidadeUniversitaria

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gocampus}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gocampus}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:gocampus123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate/JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# App Config
app.jwt.secret=mobilidade-universitaria-jwt-secret-dev-fixed
app.jwt.expiration-ms=86400000
app.qrcode.secret=mobilidade-universitaria-qrcode-secret-dev
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:4200,http://localhost:8081
app.upload.dir=${APP_UPLOAD_DIR:./uploads}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Server port
server.port=${SERVER_PORT:8081}
